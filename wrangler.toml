name = "mirror-bot"
main = "src/index.ts"
compatibility_date = "2026-11-08"
workers_dev = true
minify = true

[vars]
APP_ENV = "development"
PUBLIC_BOT_USERNAME = "MirrorDiscoverBot"
SUPABASE_URL = "https://your-project-ref.supabase.co"

[observability]
enabled = true

[secrets]
required = [
  "TELEGRAM_BOT_TOKEN",
  "TELEGRAM_WEBHOOK_SECRET",
  "SUPABASE_SECRET_KEY"
]
