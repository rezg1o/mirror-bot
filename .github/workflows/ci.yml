name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies and generate the initial lockfile
        run: npm install --no-audit --no-fund

      - name: Upload initial dependency lockfile
        uses: actions/upload-artifact@v6
        with:
          name: mirror-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Run all quality gates
        run: npm run ci
